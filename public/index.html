<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>ZOUUU — Drop Gate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="gate" id="gate">
    <div class="slides" id="slides" aria-hidden="true"></div>
    <div class="shade"></div>

    <button class="nav prev" id="prevBtn" type="button" aria-label="Previous slide">‹</button>
    <button class="nav next" id="nextBtn" type="button" aria-label="Next slide">›</button>

    <section class="content">
      <div class="brand-wrap"><img id="logo" class="logo hidden" alt="ZOUUU"></div>
      <div class="brand-text" id="brandText">ZOUUU</div>
      <div class="eyebrow" id="title">FIRST DROP</div>

      <div class="countdown" aria-label="Countdown">
        <span><b id="days">00</b><small>DAYS</small></span>
        <span><b id="hours">00</b><small>HOURS</small></span>
        <span><b id="minutes">00</b><small>MINUTES</small></span>
        <span><b id="seconds">00</b><small>SECONDS</small></span>
      </div>

      <p id="message">ENTER YOUR EMAIL TO RECEIVE DROP INFORMATION.</p>

      <form id="emailForm" autocomplete="email">
        <input id="email" type="email" inputmode="email" placeholder="YOUR EMAIL" autocomplete="email" required maxlength="254">
        <button id="submitBtn" type="submit">ENTER</button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>

      <div class="dots" id="dots" aria-label="Slide navigation"></div>
    </section>
    <section id="preorder" class="content hidden" style="max-width:620px;margin:0 auto;padding:24px 16px;overflow:auto;max-height:100vh">
      <div class="brand-text">ZOUUU</div><div class="eyebrow" id="preorderTitle">PREORDER</div>
      <p id="paymentInfo"></p><div id="qrisWrap"></div><p id="shippingInfo"></p><p id="whatYouGet"></p>
      <form id="orderForm"></form><div id="orderStatus" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
